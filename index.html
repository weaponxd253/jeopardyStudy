<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-grid"></div>

  <header>
    <div class="header-inner">
      <h1 class="logo">JEOPARDY!</h1>
      <div class="header-controls">
        <div class="score-display">
          <span class="score-label">SCORE</span>
          <span id="score" class="score-value">$0</span>
        </div>
        <button id="reset-button" class="btn btn-ghost">↺ Reset</button>
      </div>
    </div>
  </header>

  <main>

    <!-- ── Topic Browser (shown until a board loads) ── -->
    <div id="topic-browser" class="topic-browser">
      <div class="browser-header">
        <input
          type="text"
          id="topic-search"
          class="topic-search"
          placeholder="🔍  Search topics…"
          autocomplete="off"
        />
        <span id="topic-count" class="topic-count"></span>
      </div>
      <div id="category-filters" class="category-filters"></div>
      <div id="topic-grid" class="topic-grid"></div>
      <div class="browser-footer">
        <span id="selected-label" class="selected-label"></span>
        <button id="random-button" class="btn btn-ghost">⚄ Random</button>
        <button id="play-button" class="btn btn-primary" disabled>▶ Play</button>
      </div>
    </div>

    <!-- ── Now Playing Bar (replaces browser when board is active) ── -->
    <div id="now-playing" class="now-playing hidden">
      <div class="now-playing-inner">
        <span class="now-playing-pip"></span>
        <span class="now-playing-label">NOW PLAYING</span>
        <span id="now-playing-topic" class="now-playing-topic"></span>
        <div class="now-playing-spacer"></div>
        <button id="change-topic" class="btn btn-ghost btn-sm">⇄ Change Topic</button>
      </div>
    </div>

    <!-- ── Loading ── -->
    <div id="loading-state" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Loading board…</p>
    </div>

    <!-- ── Game Board ── -->
    <div id="board" class="jeopardy-board hidden"></div>

  </main>

  <!-- Question Modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="question-text">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="close-btn hidden" id="close-btn" aria-label="Close">&times;</button>

      <div class="modal-category-label" id="modal-category-label"></div>
      <div class="modal-value-label"    id="modal-value-label"></div>
      <div id="question-text" class="question-text"></div>

      <div id="timer-bar-container" class="timer-bar-container">
        <div id="timer-bar" class="timer-bar"></div>
        <span id="time-left" class="time-left-text">30</span>
      </div>

      <div class="answer-row">
        <input type="text" id="answer" placeholder="What is…?" autocomplete="off" />
        <button id="submit-answer" class="btn btn-primary">Submit</button>
      </div>

      <div id="result-area" class="result-area hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
